---
# Deploy django-seedkit.viewflow.io — a static landing page, no application.
#
# nginx on viewflow.io serves site/ straight from disk. Certbot holds the
# certificate; the vhost goes live over HTTP first so the ACME challenge can
# reach it.
#
# Usage:
#     ansible-playbook -i ansible/inventory.ini ansible/deploy.yml
# Content-only refresh (skip certbot, it is idempotent anyway):
#     ansible-playbook -i ansible/inventory.ini ansible/deploy.yml --tags content

- name: Deploy the django-seedkit landing page
  hosts: edge
  become: true
  vars:
    domain: django-seedkit.viewflow.io
    srv_dir: /srv/django-seedkit-viewflow-io
    conf_name: django-seedkit-viewflow-io.conf

  handlers:
    - name: Reload nginx
      ansible.builtin.shell: nginx -t && systemctl reload nginx

  tasks:
    - name: Create the site and ACME webroot directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ srv_dir }}"
        - "{{ srv_dir }}/public"
        - "{{ srv_dir }}/.letsencrypt"
      tags: [content]

    - name: Check whether the TLS certificate already exists
      ansible.builtin.stat:
        path: "/etc/letsencrypt/live/{{ domain }}/fullchain.pem"
      register: cert_stat

    - name: Render the nginx site config (HTTP-only until the cert exists)
      ansible.builtin.template:
        src: templates/nginx.conf.j2
        dest: "/etc/nginx/sites-available/{{ conf_name }}"
        owner: root
        group: root
        mode: "0644"
      vars:
        cert_exists: "{{ cert_stat.stat.exists }}"
      notify: Reload nginx

    - name: Enable the site
      ansible.builtin.file:
        src: "/etc/nginx/sites-available/{{ conf_name }}"
        dest: "/etc/nginx/sites-enabled/{{ conf_name }}"
        state: link
      notify: Reload nginx

    - name: Flush handlers so the HTTP vhost is live before requesting a cert
      ansible.builtin.meta: flush_handlers

    - name: Obtain the TLS certificate via the certbot webroot
      ansible.builtin.command:
        cmd: >
          certbot certonly --non-interactive --agree-tos
          --webroot -w {{ srv_dir }}/.letsencrypt
          -d {{ domain }}
          -m mikhail@viewflow.io
      args:
        creates: "/etc/letsencrypt/live/{{ domain }}/fullchain.pem"
      register: certbot_result

    - name: Re-render the nginx site config with SSL now that the cert exists
      ansible.builtin.template:
        src: templates/nginx.conf.j2
        dest: "/etc/nginx/sites-available/{{ conf_name }}"
        owner: root
        group: root
        mode: "0644"
      vars:
        cert_exists: true
      when: certbot_result is changed
      notify: Reload nginx

    - name: Synchronize the site content
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../site/"
        dest: "{{ srv_dir }}/public/"
        delete: true
        use_ssh_args: true
        rsync_opts:
          - "--exclude=.DS_Store"
      tags: [content]

    - name: Fix ownership and permissions on the served files
      ansible.builtin.file:
        path: "{{ srv_dir }}/public"
        owner: root
        group: root
        recurse: true
      tags: [content]

    - name: Flush handlers before the smoke test
      ansible.builtin.meta: flush_handlers

    - name: Smoke test the page over HTTPS
      ansible.builtin.uri:
        url: "https://{{ domain }}/"
        return_content: true
      register: smoke
      retries: 6
      delay: 5
      until: smoke.status == 200 and 'Django Seedkit' in smoke.content
      tags: [content]

    - name: Smoke test robots.txt and the sitemap
      ansible.builtin.uri:
        url: "https://{{ domain }}/{{ item }}"
      loop:
        - robots.txt
        - sitemap.xml
      tags: [content]

    # The sitemap advertises these; a green deploy that 404s every article is worse
    # than a red one. Every new article gets a line here and a <url> in sitemap.xml.
    - name: Smoke test the blog index and each article
      ansible.builtin.uri:
        url: "https://{{ domain }}{{ item }}"
      loop:
        - /blog/
        - /blog/django-magic-link-login/
        - /blog/django-stripe-checkout/
        - /blog/django-celery-redis/
        - /blog/django-tailwind-without-node/
        - /blog/django-brute-force-lockout/
        - /assets/blog.css
      tags: [content]
